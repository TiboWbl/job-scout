<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scout · Direction A · Éditorial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F3EEE4; --card: #FFFDF9; --ink: #1F1C17; --muted: #6E675B; --soft: #9A927F;
    --line: #E6DFD2; --accent: #2D5A4A;
    --coeur-bg: #F6DCCF; --coeur: #9A3F1F;
    --solide-bg: #DCE8E1; --solide: #2D5A4A;
    --tremplin-bg: #EFE5CC; --tremplin: #7A5B12;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: #E7E1D5; font-family: "DM Sans", sans-serif; color: var(--ink); padding: 40px 0 80px; }
  .frame-label { width: 1280px; margin: 0 auto 12px; font-size: 13px; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
  .frame { width: 1280px; margin: 0 auto 56px; background: var(--bg); border-radius: 18px; overflow: hidden; box-shadow: 0 30px 80px -40px rgba(31,28,23,.35); }

  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 22px 48px; }
  .brand { font-family: "Instrument Serif", serif; font-size: 30px; font-style: italic; letter-spacing: -.01em; }
  .nav { display: flex; gap: 4px; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 5px; }
  .nav a { font-size: 14px; padding: 8px 16px; border-radius: 999px; color: var(--muted); text-decoration: none; }
  .nav a.on { background: var(--ink); color: var(--bg); }
  .me { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); }
  .kbd { border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 13px; background: var(--card); }
  .avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 600; font-size: 14px; }

  .page { padding: 28px 48px 56px; }
  .eyebrow { font-size: 13px; color: var(--soft); letter-spacing: .06em; text-transform: uppercase; }
  h1 { font-family: "Instrument Serif", serif; font-weight: 400; font-size: 64px; line-height: 1; letter-spacing: -.02em; margin-top: 10px; }
  h1 em { color: var(--accent); }
  .lede { font-size: 18px; color: var(--muted); margin-top: 14px; max-width: 640px; line-height: 1.5; }
  h2 { font-family: "Instrument Serif", serif; font-weight: 400; font-size: 30px; letter-spacing: -.01em; }

  .grid { display: grid; grid-template-columns: 1fr 340px; gap: 40px; margin-top: 44px; }
  .section-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 18px; }
  .section-head a { font-size: 14px; color: var(--accent); text-decoration: none; }

  .feature { background: var(--card); border-radius: 22px; overflow: hidden; border: 1px solid var(--line); }
  .feature .visual { height: 250px; position: relative; }
  .feature .body { padding: 26px 28px 28px; }
  .row { display: flex; align-items: center; gap: 14px; }
  .logo { width: 48px; height: 48px; border-radius: 12px; background: #fff; border: 1px solid var(--line); object-fit: contain; padding: 6px; }
  .logo-fallback { display: grid; place-items: center; background: var(--accent); color: #fff; font-weight: 600; padding: 0; }
  .company { font-size: 14px; color: var(--muted); }
  .title { font-family: "Instrument Serif", serif; font-size: 30px; line-height: 1.1; margin-top: 4px; letter-spacing: -.01em; }
  .meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .meta span { font-size: 13px; padding: 6px 12px; border-radius: 999px; background: #F3EEE4; color: var(--muted); }
  .why { margin-top: 16px; font-size: 15px; line-height: 1.55; color: var(--ink); }
  .why::before { content: "Pourquoi : "; color: var(--soft); }
  .badge { font-size: 12px; font-weight: 600; padding: 5px 11px; border-radius: 999px; }
  .badge.coeur { background: var(--coeur-bg); color: var(--coeur); }
  .badge.solide { background: var(--solide-bg); color: var(--solide); }
  .badge.tremplin { background: var(--tremplin-bg); color: var(--tremplin); }
  .new { font-size: 12px; color: var(--accent); font-weight: 500; }
  .on-visual { position: absolute; top: 18px; left: 18px; display: flex; gap: 8px; }
  .on-visual .badge, .on-visual .new { background: rgba(255,253,249,.92); backdrop-filter: blur(6px); padding: 5px 11px; border-radius: 999px; }

  .actions { display: flex; align-items: center; gap: 10px; margin-top: 22px; }
  .btn { font: 500 14px "DM Sans", sans-serif; border-radius: 999px; padding: 10px 18px; border: 1px solid var(--line); background: transparent; color: var(--ink); }
  .btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .btn.quiet { border-color: transparent; color: var(--muted); }
  .spacer { flex: 1; }
  .fresh { font-size: 13px; color: var(--soft); }

  .minis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 16px; }
  .mini { background: var(--card); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
  .mini .visual { height: 110px; }
  .mini .body { padding: 16px 16px 18px; }
  .mini .title { font-size: 21px; }
  .mini .logo { width: 36px; height: 36px; border-radius: 10px; padding: 4px; }
  .mini .why { font-size: 13px; margin-top: 10px; }

  .side { display: flex; flex-direction: column; gap: 18px; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 22px; }
  .panel h3 { font-family: "Instrument Serif", serif; font-weight: 400; font-size: 24px; margin-bottom: 14px; }
  .task { display: flex; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
  .task:first-of-type { border-top: 0; padding-top: 0; }
  .task .logo { width: 36px; height: 36px; border-radius: 10px; padding: 4px; }
  .task strong { display: block; font-size: 14px; font-weight: 600; }
  .task small { font-size: 12px; color: var(--soft); }
  .task .btn { margin-left: auto; padding: 7px 13px; font-size: 13px; }
  .interview { background: var(--accent); color: #F3EEE4; border: 0; }
  .interview h3 { color: #F3EEE4; }
  .interview .when { font-family: "Instrument Serif", serif; font-size: 34px; line-height: 1; }
  .interview p { font-size: 14px; opacity: .8; margin-top: 8px; }
  .week { display: flex; gap: 22px; }
  .week div { flex: 1; }
  .week b { font-family: "Instrument Serif", serif; font-weight: 400; font-size: 40px; display: block; line-height: 1; }
  .week span { font-size: 13px; color: var(--muted); }
  .week-note { font-size: 13px; color: var(--muted); margin-top: 14px; line-height: 1.5; }

  .filters { display: flex; gap: 8px; margin-top: 28px; }
  .chip { font-size: 14px; padding: 8px 15px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--muted); }
  .chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .feed { display: flex; flex-direction: column; gap: 18px; margin-top: 30px; max-width: 980px; }
  .item { display: grid; grid-template-columns: 1fr 300px; background: var(--card); border: 1px solid var(--line); border-radius: 22px; overflow: hidden; }
  .item .body { padding: 26px 28px; }
  .item .visual { min-height: 100%; }
  .item .title { font-size: 28px; }
  .day-group { font-family: "Instrument Serif", serif; font-style: italic; font-size: 22px; color: var(--muted); margin: 18px 0 -4px; }
  .footnote { text-align: center; font-size: 12px; color: var(--muted); margin-top: -32px; }
</style>
</head>
<body>

<p class="frame-label">Direction A · Éditorial chaleureux · Écran « Aujourd'hui »</p>
<div class="frame" id="today"></div>

<p class="frame-label">Direction A · Éditorial chaleureux · Écran « Offres »</p>
<div class="frame" id="offers"></div>

<p class="footnote">Maquette statique. Entreprises réelles, offres fictives.</p>

<script src="data.js"></script>
<script>
  const topbar = (active) => `
    <div class="topbar">
      <div class="brand">Scout</div>
      <nav class="nav">${NAV.map((n) => `<a class="${n === active ? "on" : ""}">${n}</a>`).join("")}</nav>
      <div class="me"><span class="kbd">⌘K</span><span class="avatar">C</span></div>
    </div>`;

  const badges = (o) => `<span class="badge ${o.level}">${LEVELS[o.level].label}</span>${o.isNew ? `<span class="new">Publiée ${o.freshness.toLowerCase()}</span>` : ""}`;
  const meta = (o) => `<div class="meta"><span>${o.location}</span><span>${o.remote}</span><span>${o.contract}</span></div>`;
  const actions = (o) => `
    <div class="actions">
      <button class="btn primary">Postuler</button>
      <button class="btn">Sauvegarder</button>
      <button class="btn quiet">Pas pour moi</button>
      <span class="spacer"></span><span class="fresh">${o.freshness}</span>
    </div>`;

  const [first, ...rest] = OFFERS;

  document.getElementById("today").innerHTML = `
    ${topbar("Aujourd'hui")}
    <div class="page">
      <p class="eyebrow">${TODAY.date}</p>
      <h1>Bonjour ${TODAY.firstName}, <em>quatre offres</em> t'attendent.</h1>
      <p class="lede">Une sélection courte, choisie pour toi ce matin. Deux relances à envoyer et un entretien jeudi.</p>

      <div class="grid">
        <div>
          <div class="section-head"><h2>Ta sélection du jour</h2><a>Voir toutes les offres</a></div>
          <article class="feature">
            <div class="visual" style="${visualStyle(first)}"><div class="on-visual">${badges(first)}</div></div>
            <div class="body">
              <div class="row">${logoImg(first, "logo")}<div><div class="company">${first.company}</div><div class="title">${first.title}</div></div></div>
              ${meta(first)}
              <p class="why">${first.why}</p>
              ${actions(first)}
            </div>
          </article>
          <div class="minis">
            ${rest.slice(0, 3).map((o) => `
              <article class="mini">
                <div class="visual" style="${visualStyle(o)}"></div>
                <div class="body">
                  <div class="row">${logoImg(o, "logo")}<span class="badge ${o.level}">${LEVELS[o.level].label}</span></div>
                  <div class="title">${o.title}</div>
                  <div class="company" style="margin-top:4px">${o.company} · ${o.location}</div>
                  <p class="why">${o.why}</p>
                </div>
              </article>`).join("")}
          </div>
        </div>

        <aside class="side">
          <div class="panel">
            <h3>Relances à faire</h3>
            ${TODAY.followUps.map((f) => `
              <div class="task">${logoImg(f, "logo")}<div><strong>${f.company}</strong><small>${f.title} · ${f.since.replace("Candidature envoyée ", "")}</small></div><button class="btn">Relancer</button></div>`).join("")}
          </div>
          <div class="panel interview">
            <h3>Prochain entretien</h3>
            <div class="when">${TODAY.interviews[0].when}, ${TODAY.interviews[0].time}</div>
            <p>${TODAY.interviews[0].company} · ${TODAY.interviews[0].title} · ${TODAY.interviews[0].mode}</p>
          </div>
          <div class="panel">
            <h3>Ta semaine</h3>
            <div class="week">
              <div><b>${TODAY.week.applied}</b><span>candidatures</span></div>
              <div><b>${TODAY.week.interviews}</b><span>entretien</span></div>
              <div><b>${TODAY.week.saved}</b><span>sauvegardées</span></div>
            </div>
            <p class="week-note">Belle régularité. Un entretien obtenu, c'est déjà une porte ouverte.</p>
          </div>
        </aside>
      </div>
    </div>`;

  document.getElementById("offers").innerHTML = `
    ${topbar("Offres")}
    <div class="page">
      <h1>Offres</h1>
      <p class="lede">Classées par niveau, puis par pertinence. Huit offres cette semaine.</p>
      <div class="filters">
        <span class="chip on">Tous les niveaux</span><span class="chip">Coups de cœur</span><span class="chip">Moins de 48 h</span><span class="chip">CDI</span><span class="chip">Hybride</span><span class="chip">Écartées</span>
      </div>
      <div class="feed">
        <p class="day-group">Coups de cœur</p>
        ${OFFERS.filter((o) => o.level === "coeur").map(item).join("")}
        <p class="day-group">Solides et tremplins</p>
        ${OFFERS.filter((o) => o.level !== "coeur").slice(0, 2).map(item).join("")}
      </div>
    </div>`;

  function item(o) {
    return `
      <article class="item">
        <div class="body">
          <div class="row">${logoImg(o, "logo")}<div><div class="company">${o.company}</div><div class="title">${o.title}</div></div></div>
          <div class="row" style="margin-top:14px; gap:10px">${badges(o)}</div>
          ${meta(o)}
          <p class="why">${o.why}</p>
          ${actions(o)}
        </div>
        <div class="visual" style="${visualStyle(o)}"></div>
      </article>`;
  }
</script>
</body>
</html>
